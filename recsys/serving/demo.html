<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netflix-Style Recommender</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #171717;
      --panel-2: #242424;
      --text: #f5f5f5;
      --muted: #b8b8b8;
      --accent: #e50914;
      --line: #2c2c2c;
      --good: #46d369;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      height: 64px;
      padding: 0 clamp(18px, 4vw, 54px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(8, 8, 8, 0.92);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
    }
    .brand { color: var(--accent); font-weight: 950; font-size: 24px; letter-spacing: 0; }
    .nav { display: flex; align-items: center; gap: 18px; color: #d6d6d6; font-size: 14px; }
    .shell { padding-bottom: 42px; }
    .hero {
      min-height: 430px;
      padding: 54px clamp(18px, 4vw, 54px) 34px;
      display: grid;
      align-items: end;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background:
        radial-gradient(circle at 78% 18%, rgba(229,9,20,0.28), transparent 28%),
        linear-gradient(90deg, #080808 0%, rgba(8,8,8,0.88) 40%, rgba(8,8,8,0.34) 100%),
        linear-gradient(135deg, #1d1d1d, #3a1a1f 42%, #111 100%);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 130px;
      background: linear-gradient(transparent, var(--bg));
      pointer-events: none;
    }
    .hero-content {
      width: min(760px, 100%);
      position: relative;
      z-index: 1;
      display: grid;
      gap: 16px;
    }
    .eyebrow { color: var(--good); font-size: 14px; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(38px, 7vw, 78px); line-height: 0.95; letter-spacing: 0; }
    .hero-meta, .why, .status { color: var(--muted); line-height: 1.5; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button, select {
      height: 42px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font: inherit;
    }
    button {
      border: 0;
      background: white;
      color: #101010;
      padding: 0 18px;
      font-weight: 900;
      cursor: pointer;
    }
    button.secondary { background: rgba(109,109,110,0.72); color: white; }
    select {
      background: #141414;
      color: white;
      padding: 0 12px;
      min-width: 190px;
    }
    main {
      display: grid;
      gap: 28px;
      padding: 0 clamp(18px, 4vw, 54px);
      margin-top: -14px;
      position: relative;
      z-index: 2;
    }
    .profile-strip {
      display: grid;
      grid-template-columns: minmax(220px, 320px) 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .panel {
      border: 1px solid var(--line);
      background: rgba(23,23,23,0.92);
      border-radius: 8px;
      padding: 16px;
      min-width: 0;
    }
    .panel h2, .row h2 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: 0;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid #404040;
      border-radius: 999px;
      color: #e9e9e9;
      padding: 5px 10px;
      font-size: 13px;
      white-space: nowrap;
    }
    .history {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }
    .history-item {
      padding: 10px;
      border-radius: 6px;
      background: #101010;
      border: 1px solid #282828;
      min-height: 74px;
    }
    .history-title { font-weight: 750; line-height: 1.25; }
    .row { display: grid; gap: 10px; }
    .rail {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(168px, 190px);
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-color: #555 transparent;
    }
    .movie-card {
      min-height: 286px;
      border-radius: 8px;
      background: #151515;
      border: 1px solid #292929;
      overflow: hidden;
      display: grid;
      grid-template-rows: 188px 1fr;
      transition: transform 150ms ease, border-color 150ms ease;
    }
    .movie-card:hover { transform: translateY(-3px); border-color: #555; }
    .poster {
      padding: 14px;
      display: grid;
      align-content: space-between;
      background:
        linear-gradient(145deg, var(--poster-a), var(--poster-b)),
        linear-gradient(#222, #111);
      position: relative;
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 45%, rgba(0,0,0,0.58));
    }
    .poster-mark, .poster-title { position: relative; z-index: 1; }
    .poster-mark { color: rgba(255,255,255,0.82); font-size: 12px; font-weight: 900; }
    .poster-title { font-weight: 950; line-height: 1.05; font-size: 21px; text-wrap: balance; }
    .card-body { padding: 12px; display: grid; gap: 7px; align-content: start; }
    .card-title { font-weight: 850; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .match { color: var(--good); font-weight: 850; font-size: 13px; }
    .source { color: #888; font-size: 12px; }
    @media (max-width: 760px) {
      header { height: auto; padding-top: 14px; padding-bottom: 14px; align-items: flex-start; flex-direction: column; }
      .nav { flex-wrap: wrap; gap: 10px; }
      .hero { min-height: 390px; }
      .profile-strip { grid-template-columns: 1fr; }
      .rail { grid-auto-columns: minmax(152px, 168px); }
      .movie-card { grid-template-rows: 168px 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">RECSYS</div>
    <nav class="nav">
      <span>Home</span>
      <span>Movies</span>
      <span>Top Picks</span>
      <select id="user"></select>
    </nav>
  </header>
  <div class="shell">
    <section class="hero" id="hero">
      <div class="hero-content">
        <div class="eyebrow" id="heroEyebrow">Personalized for MovieLens</div>
        <h1 id="heroTitle">Loading recommendations</h1>
        <div class="hero-meta" id="heroMeta"></div>
        <div class="why" id="heroWhy"></div>
        <div class="hero-actions">
          <button id="refresh">Recommend</button>
          <button class="secondary" id="nextUser">Next profile</button>
          <span class="status" id="latency"></span>
        </div>
      </div>
    </section>
    <main>
      <section class="profile-strip">
        <div class="panel">
          <h2>Profile taste</h2>
          <div class="chips" id="genres"></div>
          <div class="source" style="margin-top:12px">Real MovieLens ratings, anonymized user IDs.</div>
        </div>
        <div class="panel">
          <h2>Recently loved by this profile</h2>
          <div class="history" id="history"></div>
        </div>
      </section>
      <section class="row">
        <h2 id="topPicksTitle">Top picks</h2>
        <div class="rail" id="topPicks"></div>
      </section>
      <div id="browseRows"></div>
    </main>
  </div>
  <script>
    const state = { users: [], recommendations: [], profile: null };
    const userSelect = document.querySelector("#user");
    const refreshButton = document.querySelector("#refresh");
    const nextUserButton = document.querySelector("#nextUser");
    const latencyEl = document.querySelector("#latency");
    const heroTitle = document.querySelector("#heroTitle");
    const heroMeta = document.querySelector("#heroMeta");
    const heroWhy = document.querySelector("#heroWhy");
    const heroEyebrow = document.querySelector("#heroEyebrow");
    const topPicks = document.querySelector("#topPicks");
    const topPicksTitle = document.querySelector("#topPicksTitle");
    const genresEl = document.querySelector("#genres");
    const historyEl = document.querySelector("#history");
    const browseRowsEl = document.querySelector("#browseRows");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function palette(seed) {
      let hash = 0;
      for (const ch of String(seed || "")) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      const hue = hash % 360;
      return [`hsl(${hue} 62% 34%)`, `hsl(${(hue + 48) % 360} 72% 18%)`];
    }

    function meta(item) {
      const bits = [];
      if (item.release_year) bits.push(item.release_year);
      if (item.avg_rating) bits.push(`${Number(item.avg_rating).toFixed(1)} avg`);
      if (item.rating_count) bits.push(`${item.rating_count} ratings`);
      return bits.join(" · ");
    }

    function card(item, index) {
      const colors = palette(item.poster_seed || item.item_id);
      const genres = (item.genres || []).slice(0, 3).join(" / ");
      const score = item.score ? `${Math.round(Math.max(0, Math.min(0.99, item.score)) * 100)}% match` : "";
      return `
        <article class="movie-card" style="--poster-a:${colors[0]};--poster-b:${colors[1]}">
          <div class="poster">
            <div class="poster-mark">${index != null ? "#" + (index + 1) : "MOVIE"}</div>
            <div class="poster-title">${esc(item.title)}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${esc(item.title)}</div>
            <div class="match">${esc(score)}</div>
            <div class="meta">${esc(meta(item))}</div>
            <div class="meta">${esc(genres || "Movie")}</div>
          </div>
        </article>
      `;
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    async function loadUsers() {
      const data = await fetchJson("/sample-users?limit=40");
      state.users = data.users;
      userSelect.innerHTML = state.users.map(user => `<option value="${esc(user)}">${esc(user.replace("ml_user_", "Profile "))}</option>`).join("");
    }

    async function loadProfile() {
      state.profile = await fetchJson(`/profile/${encodeURIComponent(userSelect.value)}`);
      genresEl.innerHTML = (state.profile.top_genres || []).map(g => `<span class="chip">${esc(g.genre)}</span>`).join("");
      historyEl.innerHTML = (state.profile.history || []).slice(0, 6).map(item => `
        <div class="history-item">
          <div class="history-title">${esc(item.title)}</div>
          <div class="meta">${esc(item.rating ? item.rating.toFixed(1) + " stars" : item.event_type)}</div>
        </div>
      `).join("");
    }

    async function recommend() {
      const userId = userSelect.value;
      refreshButton.disabled = true;
      topPicks.innerHTML = "";
      try {
        await loadProfile();
        const data = await fetchJson("/recommend", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({user_id: userId, k: 18, context: {surface: "netflix_demo"}})
        });
        state.recommendations = data.items;
        latencyEl.textContent = `${data.latency_ms.toFixed(1)} ms`;
        topPicksTitle.textContent = `Top picks for ${userId.replace("ml_user_", "Profile ")}`;
        topPicks.innerHTML = data.items.map(card).join("");
        const hero = data.items[0];
        if (hero) {
          const favorite = (state.profile.history || [])[0];
          heroTitle.textContent = hero.title;
          heroMeta.textContent = `${meta(hero)} · ${(hero.genres || []).slice(0, 3).join(" / ")}`;
          heroWhy.textContent = favorite
            ? `Recommended because this profile rated ${favorite.title} highly and has a similar taste pattern.`
            : "Recommended from collaborative MovieLens rating patterns.";
          heroEyebrow.textContent = `${Math.round(Math.max(0, Math.min(0.99, hero.score || 0)) * 100)}% personalized match`;
        }
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function loadBrowseRows() {
      const data = await fetchJson("/browse-rows?limit=18");
      browseRowsEl.innerHTML = data.rows.map(row => `
        <section class="row">
          <h2>${esc(row.title)}</h2>
          <div class="rail">${row.items.map((item) => card(item, null)).join("")}</div>
        </section>
      `).join("");
    }

    refreshButton.addEventListener("click", recommend);
    userSelect.addEventListener("change", recommend);
    nextUserButton.addEventListener("click", () => {
      userSelect.selectedIndex = (userSelect.selectedIndex + 1) % userSelect.options.length;
      recommend();
    });

    (async function boot() {
      try {
        await loadUsers();
        await Promise.all([recommend(), loadBrowseRows()]);
      } catch (error) {
        heroTitle.textContent = "Could not load recommendations";
        heroWhy.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
