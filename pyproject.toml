[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-style-recsys"
version = "0.1.0"
description = "Local-first production blueprint for a Netflix-style AI recommendation system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "mlflow>=2.10",
]
data = [
  "pyarrow>=15.0",
  "duckdb>=0.10",
  "great-expectations>=0.18",
]
ann = [
  "faiss-cpu>=1.8; platform_system != 'Darwin'",
  "annoy>=1.17",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["recsys*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
