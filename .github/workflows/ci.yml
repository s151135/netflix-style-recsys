name: ci

on:
  pull_request:
  push:
    branches: [main, 'improve/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: ruff check recsys scripts tests
      - run: python -m build
      - name: Verify installed wheel outside source tree
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install -r requirements-dev.lock dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python -I "$GITHUB_WORKSPACE/scripts/check_installed.py"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker build -f infra/docker/Dockerfile -t recsys:test .
      - name: Smoke test running image
        run: |
          docker run -d --name recsys -p 127.0.0.1:8000:8000 recsys:test
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/readyz && break
            sleep 2
          done
          python scripts/smoke_api.py --base-url http://127.0.0.1:8000
      - name: Container diagnostics
        if: always()
        run: docker logs recsys || true
