services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: uvicorn recsys.serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      RECSYS_CONFIG: /app/configs/local_mac.yaml
      RECSYS_ARTIFACT_DIR: /app/artifacts/local
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: recsys
      POSTGRES_DB: recsys
    ports:
      - "5432:5432"
  mlflow:
    image: ghcr.io/mlflow/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
  prometheus:
    image: prom/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
